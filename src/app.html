<!doctype html>
<html lang="%lang%" dir="%dir%" data-theme="wishlist" data-mode="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <script src="https://code.iconify.design/iconify-icon/2.2.0/iconify-icon.min.js"></script>
        <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=3" />
        <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=3" />
        <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png?v=3" />
        <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png?v=3" />
        <link
            rel="preload"
            href="%sveltekit.assets%/fonts/karla-latin-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg?v=3" color="#E9533F" />
        <meta name="theme-color" content="#0b1633" />
        %sveltekit.head%
    </head>
    <body>
        <div>%sveltekit.body%</div>
    </body>
</html>
